name: Validate quarterly analytics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-tesla.yml'
      - 'analytics_v2/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.1,<3' 'matplotlib>=3.8,<4'
      - run: python analytics_v2/run.py
      - name: Validate quarterly and annual calculations
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('analytics_v2/output/quarterly_kpis.csv')
          assert len(d)==12 and d.quarter_end.is_unique
          assert d.revenue_usd_m.gt(0).all()
          assert (d.operating_margin-d.operating_income_usd_m/d.revenue_usd_m).abs().max()<1e-9
          assert d.forecast_error.iloc[4:].notna().all()
          d['year']=pd.to_datetime(d.quarter_end).dt.year
          a=d.groupby('year')[['revenue_usd_m','operating_income_usd_m','deliveries','energy_revenue_usd_m']].sum()
          a['operating_margin']=a.operating_income_usd_m/a.revenue_usd_m
          a.to_csv('analytics_v2/output/annual_kpis.csv')
          print(a.to_string())
          print('2025 retrospective delivery MAE',d.loc[d.year.eq(2025),'forecast_error'].abs().mean())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tesla-validated-quarterly-report
          path: analytics_v2/output/
          if-no-files-found: error
